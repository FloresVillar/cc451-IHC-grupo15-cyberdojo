<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f1d1a">
<meta name="description" content="Dojo de concientización en ciberseguridad con combates por chat y voz.">
<title>CyberDojo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<div class="presenter" aria-label="Controles de la demo">
  <strong>CyberDojo v0.3</strong>
  <span class="estado" id="estado" role="status"><i></i><span>Conectando…</span></span>
  <label>Ir a <select id="jump"></select></label>
  <button id="reset" type="button">Reiniciar demo</button>
</div>
<div class="phone" id="phone">
  <div id="vista"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="oido" id="oido" hidden aria-live="polite"></div>
  <button class="fab" id="fab" type="button" aria-label="Hablar: comando de voz o pregunta al sensei" title="Comando de voz (tecla V)">🎙️</button>
</div>
<div class="sr" aria-live="polite" id="live"></div>

<script src="escenarios.js"></script>
<script src="js/reglas.js"></script>
<script src="js/voz.js"></script>
<script src="js/emocion.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
